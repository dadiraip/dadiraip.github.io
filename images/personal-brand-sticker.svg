<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Dadirai Pise personal brand sticker</title>
  <desc id="desc">A bold teal dotted letter D on a cream and pale teal badge, accented with gold dots.</desc>
  <defs>
    <pattern id="teal-dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="5.5" fill="#1f7776"/>
      <circle cx="32" cy="31" r="4.5" fill="#1f7776"/>
    </pattern>
    <clipPath id="d-shape"><path d="M288 217 H478 C664 217 778 337 778 512 C778 687 664 807 478 807 H288 Z"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#173437" flood-opacity=".18"/>
    </filter>
  </defs>
  <!-- Sticker cutline and badge -->
  <g filter="url(#lift)">
    <circle cx="512" cy="512" r="443" fill="#ffffff"/>
    <circle cx="512" cy="512" r="411" fill="#e2eeee" stroke="#173437" stroke-width="10"/>
    <circle cx="512" cy="512" r="382" fill="none" stroke="#d8a94b" stroke-width="4" stroke-dasharray="3 18" stroke-linecap="round"/>

    <!-- Main D mark -->
    <path d="M288 217 H478 C664 217 778 337 778 512 C778 687 664 807 478 807 H288 Z" fill="#fbf8f1" stroke="#1f7776" stroke-width="24" stroke-linejoin="round"/>
    <rect x="270" y="200" width="530" height="630" fill="url(#teal-dots)" clip-path="url(#d-shape)"/>
    <path d="M430 355 H480 C582 355 644 411 644 512 C644 613 582 669 480 669 H430 Z" fill="#e2eeee" stroke="#1f7776" stroke-width="14" stroke-linejoin="round"/>
    <path d="M471 405 V619 M471 405 H493 C563 405 598 444 598 512 C598 580 563 619 493 619 H471" fill="none" stroke="#173437" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gold accents and name -->
    <circle cx="256" cy="512" r="13" fill="#d8a94b"/>
    <circle cx="768" cy="512" r="13" fill="#d8a94b"/>
  </g>
</svg>
